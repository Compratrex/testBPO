services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wholesale-platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wholesale_platform};Username=${POSTGRES_USER:-wholesale_app};Password=${POSTGRES_PASSWORD:-local-dev-password}
      Jwt__Issuer: ${JWT_ISSUER:-WholesalePlatform}
      Jwt__Audience: ${JWT_AUDIENCE:-WholesalePlatform.Client}
      Jwt__Secret: ${JWT_SECRET:-development-only-secret-value-with-at-least-32-bytes}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-30}
      BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BootstrapAdmin__UseBuiltInDevelopmentAdmin: ${BOOTSTRAP_ADMIN_USE_BUILT_IN:-true}
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_HTTPS:-https://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: wholesale-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wholesale_platform}
      POSTGRES_USER: ${POSTGRES_USER:-wholesale_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
